[build-system]
requires = ["setuptools==75.3.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "local-kanban"
version = "1.0.0"
description = "Standalone offline PyQt5 Kanban desktop application"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PyQt5==5.15.11",
    "PyQt5-Qt5==5.15.2",
    "PyQt5-sip==12.15.0",
]

[tool.setuptools.packages.find]
include = ["kanban", "kanban.*"]
